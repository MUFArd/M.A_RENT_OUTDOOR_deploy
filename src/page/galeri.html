<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri | M.A Outdoor Rent</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" href="../../assets/img/SEWAALATOUTDOORBERKUALITAS.png">
    <link rel="stylesheet" href="../../assets/css/font.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-amber-50 text-green-900" data-root="../../" data-page="galeri">
    <div id="site-header"></div>
    <main class="pt-16">
        <section class="bg-green-900 text-white px-4 md:px-20 py-12">
            <h1 class="font-brush-joney text-5xl md:text-6xl -rotate-2">Galeri</h1>
            <p class="mt-3 max-w-xl text-green-100">Momen petualangan bersama penyewa M.A Outdoor Rent.</p>
        </section>
        <section class="px-4 md:px-20 py-10 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
            <div class="ph aspect-square">Foto 1</div>
            <div class="ph aspect-square">Foto 2</div>
            <div class="ph aspect-square">Foto 3</div>
            <div class="ph aspect-square">Foto 4</div>
            <div class="ph aspect-square">Foto 5</div>
            <div class="ph aspect-square">Foto 6</div>
            <div class="ph aspect-square">Foto 7</div>
            <div class="ph aspect-square">Foto 8</div>
            <div class="ph aspect-square">Foto 9</div>
            <div class="ph aspect-square">Foto 10</div>
            <div class="ph aspect-square">Foto 11</div>
            <div class="ph aspect-square">Foto 12</div>
        </section>
    </main>
    <div id="site-footer"></div>
    <style type="text/tailwindcss">
        @layer components {
    .btn-primary { @apply inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-green-800 text-amber-50 hover:bg-green-900 transition; }
    .btn-outline { @apply inline-flex items-center gap-2 px-5 py-2.5 rounded-full border border-green-800 text-green-800 hover:bg-green-800 hover:text-white transition; }
    .tag-label { @apply w-fit px-2 py-0.5 rounded-sm bg-green-800 text-amber-50 text-xl -rotate-6; }
    .ph { @apply bg-gray-200 border border-gray-300 rounded-xl flex items-center justify-center text-gray-500 text-xs; }
    .card { @apply bg-white/70 rounded-xl p-4 shadow-sm; }
    .field { @apply w-full rounded-lg bg-white px-3 py-2.5 text-green-950 outline-none border border-transparent focus:border-green-600; }
    .lbl { @apply block text-sm mb-1 text-green-100; }
  }
</style>
    <script src="../../assets/js/index.js"></script>

</body>

</html>
