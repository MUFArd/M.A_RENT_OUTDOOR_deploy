<style type="text/tailwindcss">

    .btn-primary { @apply inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-green-800 text-amber-50 hover:bg-green-900 transition; }
    .btn-outline { @apply inline-flex items-center gap-2 px-5 py-2.5 rounded-full border border-green-800 text-green-800 hover:bg-green-800 hover:text-white transition; }

    .card { @apply bg-white/70 rounded-xl p-4 shadow-sm; }
    .field { @apply w-full rounded-lg bg-white px-3 py-2.5 text-green-950 outline-none border border-transparent focus:border-green-600; }
