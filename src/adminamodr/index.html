<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin | M.A Outdoor Rent</title>
<!-- Font judul yang sama dengan website (font-brush-joney). Sesuaikan path kalau folder admin dipindah -->
<link rel="stylesheet" href="../assets/css/font.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --amber-50: #fffbeb;
    --sand: #eae7de;
    --green-950: #052e16;
    --green-900: #14532d;
    --green-800: #166534;
    --green-600: #16a34a;
    --green-400: #4ade80;
    --line: rgba(20, 83, 45, .22);
    --error: #b42318;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--amber-50);
    color: var(--green-900);
    line-height: 1.5;
  }
  .brush { font-family: "Brush Joney", "Brush Script MT", cursive; }

  header { background: var(--green-900); color: var(--amber-50); padding: 28px 20px 64px; }
  header .inner { max-width: 560px; margin: 0 auto; }
  .tag-label {
    display: inline-block; padding: 2px 10px; border-radius: 2px;
    background: var(--amber-50); color: var(--green-800);
    font-size: 1.25rem; transform: rotate(-6deg);
  }
  header h1 {
    font-size: 2.6rem; line-height: 1; margin: 14px 0 6px; font-weight: 400;
    transform: rotate(-2deg); transform-origin: left;
  }
  header h1 span { color: var(--green-400); }
  header p { margin: 0; opacity: .85; font-size: .95rem; }

  main { max-width: 560px; margin: -40px auto 0; padding: 0 20px 56px; }
  form {
    background: #fff; border-radius: 12px; padding: 22px;
    box-shadow: 0 6px 20px rgba(5, 46, 22, .14);
    display: grid; gap: 18px;
  }
  label { display: grid; gap: 6px; font-weight: 700; font-size: .9rem; }
  .hint { font-weight: 400; font-size: .8rem; color: var(--green-800); opacity: .85; }

  input[type=text], select {
    font: inherit; font-weight: 400;
    padding: 11px 12px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--amber-50); color: var(--green-900);
    width: 100%;
  }

  fieldset { border: 0; padding: 0; margin: 0; }
  legend { font-weight: 700; font-size: .9rem; padding: 0; margin-bottom: 8px; }
  .kategori { display: flex; flex-wrap: wrap; gap: 8px; }
  .kategori input { position: absolute; opacity: 0; pointer-events: none; }
  .kategori label {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--amber-50); font-weight: 600; font-size: .85rem; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .kategori label:hover { border-color: var(--green-800); }
  .kategori input:checked + label { background: var(--green-800); border-color: var(--green-800); color: var(--amber-50); }
  .kategori input:focus-visible + label { outline: 2px solid var(--green-600); outline-offset: 2px; }

  /* Penjelasan mode: tambah atau ganti */
  #infoMode {
    margin: 0; padding: 10px 12px; border-radius: 8px;
    background: var(--sand); font-size: .88rem;
    display: flex; gap: 10px; align-items: flex-start;
  }
  #infoMode i { margin-top: 3px; color: var(--green-800); }

  /* Gambar yang sedang dipakai */
  #saatIni { display: grid; gap: 6px; }
  #saatIni .judul { font-weight: 700; font-size: .9rem; }
  #saatIni img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 8px; background: var(--sand); }
  #saatIni .kosong { margin: 0; font-size: .88rem; opacity: .85; }

  .drop {
    display: grid; place-items: center; gap: 4px; text-align: center;
    padding: 22px 14px; border: 2px dashed var(--line); border-radius: 10px;
    background: var(--amber-50); cursor: pointer; font-weight: 600;
  }
  .drop:hover { border-color: var(--green-800); }
  .drop i { font-size: 1.6rem; color: var(--green-800); }
  .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .drop:focus-within { outline: 2px solid var(--green-600); outline-offset: 2px; }
  #namaFile { font-weight: 400; font-size: .85rem; color: var(--green-800); }

  #preview { display: none; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  #preview img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--sand); }
  #preview.satu { grid-template-columns: 1fr; }
  #preview.satu img { aspect-ratio: auto; max-height: 240px; object-fit: contain; }

  button {
    font: inherit; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 20px; border: 0; border-radius: 999px;
    background: var(--green-800); color: var(--amber-50);
    cursor: pointer; transition: background .15s;
  }
  button:hover { background: var(--green-900); }
  button:disabled { opacity: .6; cursor: wait; }
  button:focus-visible, select:focus-visible, input[type=text]:focus-visible { outline: 2px solid var(--green-600); outline-offset: 2px; }

  #status { margin: 0; min-height: 1.4em; font-size: .92rem; font-weight: 600; }
  #status.ok { color: var(--green-600); }
  #status.err { color: var(--error); }
</style>
</head>
<body>
<header>
  <div class="inner">
    <span class="tag-label brush">ADMIN</span>
    <h1 class="brush">Kelola <span>Gambar</span></h1>
    <p>Gambar masuk ke Google Drive, datanya tercatat di Google Sheet.</p>
  </div>
</header>

<main>
  <form id="formUpload">
    <fieldset>
      <legend>Kategori</legend>
      <div class="kategori" id="kategori">
        <input type="radio" name="kategori" id="k1" value="DOKUMENTASI" required><label for="k1"><i class="fa-solid fa-camera-retro"></i>DOKUMENTASI</label>
        <input type="radio" name="kategori" id="k2" value="GALERI"><label for="k2"><i class="fa-solid fa-images"></i>GALERI</label>
        <input type="radio" name="kategori" id="k3" value="PAKET"><label for="k3"><i class="fa-solid fa-box-open"></i>PAKET</label>
        <input type="radio" name="kategori" id="k4" value="PRODUK"><label for="k4"><i class="fa-solid fa-campground"></i>PRODUK</label>
        <input type="radio" name="kategori" id="k5" value="TRIP"><label for="k5"><i class="fa-solid fa-mountain"></i>TRIP</label>
      </div>
    </fieldset>

    <p id="infoMode" hidden><i class="fa-solid fa-circle-info"></i><span id="teksMode"></span></p>

    <label>Nama
      <input type="text" id="nama" placeholder="Pilih kategori dulu">
      <select id="namaPilih" hidden></select>
      <span class="hint" id="hintNama"></span>
    </label>

    <div id="saatIni" hidden>
      <span class="judul">Gambar saat ini</span>
      <img id="gambarLama" alt="Gambar saat ini" hidden>
      <p class="kosong" id="kosongLama" hidden>Belum ada gambar. Upload akan menambahkannya.</p>
    </div>

    <label class="drop" for="gambar">
      <i class="fa-solid fa-cloud-arrow-up"></i>
      <span id="teksPilih">Pilih gambar</span>
      <span id="namaFile">JPG, PNG, atau WebP. Otomatis diperkecil sebelum dikirim.</span>
      <input type="file" id="gambar" accept="image/jpeg,image/png,image/webp" required>
    </label>

    <div id="preview"></div>

    <button type="submit" id="btn"><i class="fa-solid fa-upload"></i><span id="teksBtn">Upload</span></button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
</main>

<!-- Data paket & produk yang sama dengan website. Sesuaikan path kalau folder admin dipindah -->
<script src="../../assets/js/data-produk.js"></script>
<script>
  // Ganti dengan URL Web App dari Apps Script (Deploy > Web app)
  const API = 'https://script.google.com/macros/s/AKfycbxmnt-M2QGupXWs3jjfq6tK9u7ginR3q5LXuzIX-19Ci744HREekX9v2eOsMPLzwOuPVQ/exec';

  const MAX_SISI = 1600;   // sisi terpanjang setelah diperkecil (px)
  const KUALITAS = 0.85;   // kualitas JPEG

  // ganti  = nama sudah pasti, upload baru menggantikan gambar lama
  // tambah = setiap upload menambah gambar baru
  // (harus sama dengan daftar GANTI di Code.gs)
  const TIPE = { DOKUMENTASI: 'tambah', GALERI: 'tambah', PAKET: 'ganti', PRODUK: 'ganti', TRIP: 'ganti' };
  const DAFTAR_TRIP = ['One Day Trip', 'Open Trip'];

  const form = document.getElementById('formUpload');
  const input = document.getElementById('gambar');
  const preview = document.getElementById('preview');
  const namaFile = document.getElementById('namaFile');
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('btn');
  const namaInput = document.getElementById('nama');
  const namaPilih = document.getElementById('namaPilih');
  const hintNama = document.getElementById('hintNama');
  const infoMode = document.getElementById('infoMode');
  const saatIni = document.getElementById('saatIni');
  const gambarLama = document.getElementById('gambarLama');
  const kosongLama = document.getElementById('kosongLama');
  const teksAwal = namaFile.textContent;

  let dataSheet = [];

  const kategoriDipilih = () => form.elements['kategori'].value;
  const modeSekarang = () => TIPE[kategoriDipilih()] || '';

  function setStatus(teks, tipe) {
    statusEl.textContent = teks;
    statusEl.className = tipe || '';
  }

  function opsi(teks) {
    const o = document.createElement('option');
    o.value = teks; o.textContent = teks;
    return o;
  }

  // Ambil data yang sudah ada di Sheet (untuk menampilkan gambar saat ini)
  async function muatData() {
    if (API.startsWith('URL_')) return;
    try {
      const res = await fetch(API);
      dataSheet = await res.json();
    } catch (err) {
      dataSheet = [];
    }
    tampilSaatIni();
  }

  function tampilSaatIni() {
    const nama = namaPilih.hidden ? '' : namaPilih.value;
    const tampil = modeSekarang() === 'ganti' && nama;
    saatIni.hidden = !tampil;
    if (!tampil) return;

    const ada = dataSheet.find(d => d.kategori === kategoriDipilih() && String(d.nama).trim() === nama);
    gambarLama.hidden = !(ada && ada.gambar);
    kosongLama.hidden = !!(ada && ada.gambar);
    if (ada && ada.gambar) gambarLama.src = ada.gambar;
  }

  // Isi pilihan nama sesuai kategori
  function isiNama() {
    const kat = kategoriDipilih();
    const mode = modeSekarang();
    namaPilih.innerHTML = '';
    let daftar = false;

    if (kat === 'PAKET' && window.PAKET) {
      namaPilih.appendChild(new Option('Pilih paket', ''));
      window.PAKET.forEach(p => namaPilih.appendChild(opsi(p.nama)));
      daftar = true;
    } else if (kat === 'PRODUK' && window.KATEGORI) {
      namaPilih.appendChild(new Option('Pilih produk', ''));
      window.KATEGORI.forEach(k => {
        const g = document.createElement('optgroup');
        g.label = k.nama;
        k.barang.forEach(b => g.appendChild(opsi(b[0])));
        namaPilih.appendChild(g);
      });
      daftar = true;
    } else if (kat === 'TRIP') {
      namaPilih.appendChild(new Option('Pilih trip', ''));
      DAFTAR_TRIP.forEach(t => namaPilih.appendChild(opsi(t)));
      daftar = true;
    }

    namaPilih.hidden = !daftar;
    namaPilih.required = daftar;
    namaPilih.value = '';
    namaInput.hidden = daftar;
    namaInput.required = !daftar && mode === 'ganti';
    namaInput.value = '';
    namaInput.placeholder = !kat ? 'Pilih kategori dulu'
      : mode === 'tambah' ? 'Keterangan gambar (boleh dikosongkan)' : 'Ketik nama';
    hintNama.textContent = daftar && kat !== 'TRIP'
      ? 'Nama diambil dari data-produk.js, jadi sama persis dengan di website.' : '';

    // Mode tambah boleh banyak gambar, mode ganti satu gambar
    input.multiple = mode === 'tambah';
    input.value = '';
    resetPreview();

    infoMode.hidden = !mode;
    document.getElementById('teksMode').textContent = mode === 'tambah'
      ? 'Menambah gambar baru. Kamu bisa memilih beberapa gambar sekaligus.'
      : mode === 'ganti'
        ? 'Mengganti gambar yang sudah ada. Pilih namanya, lalu upload gambar baru. Gambar lama otomatis dibuang.'
        : '';
    document.getElementById('teksPilih').textContent =
      mode === 'tambah' ? 'Pilih gambar (boleh lebih dari satu)' : mode === 'ganti' ? 'Pilih gambar pengganti' : 'Pilih gambar';
    document.getElementById('teksBtn').textContent =
      mode === 'tambah' ? 'Tambah gambar' : mode === 'ganti' ? 'Ganti gambar' : 'Upload';

    tampilSaatIni();
  }

  function ambilNama() {
    return namaPilih.hidden ? namaInput.value.trim() : namaPilih.value;
  }

  function resetPreview() {
    preview.innerHTML = '';
    preview.style.display = 'none';
    namaFile.textContent = teksAwal;
  }

  input.addEventListener('change', () => {
    const files = [...input.files];
    resetPreview();
    if (!files.length) return;
    namaFile.textContent = files.length === 1 ? files[0].name : files.length + ' gambar dipilih';
    preview.className = files.length === 1 ? 'satu' : '';
    files.forEach(f => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(f);
      img.alt = f.name;
      preview.appendChild(img);
    });
    preview.style.display = 'grid';
  });

  document.getElementById('kategori').addEventListener('change', isiNama);
  namaPilih.addEventListener('change', tampilSaatIni);

  // Perkecil gambar lewat canvas, hasilnya base64 JPEG
  function kompres(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const skala = Math.min(1, MAX_SISI / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * skala);
        c.height = Math.round(img.height * skala);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', KUALITAS).split(',')[1]);
      };
      img.onerror = () => reject(new Error('Gambar tidak bisa dibaca'));
      img.src = URL.createObjectURL(file);
    });
  }

  
async function kirim(file, kategori, nama) {
  const base64 = await kompres(file);

  let res;

  try {
    res = await fetch(API, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify({
        kategori,
        nama,
        filename: file.name.replace(/\.[^.]+$/, '') + '.jpg',
        mime: 'image/jpeg',
        data: base64
      })
    });
  } catch (error) {
    console.error('Upload gagal:', error);

    throw new Error(
      'Browser gagal menerima respons Apps Script. ' +
      'Buka F12 → Console untuk melihat detail error. ' +
      'Kemungkinan masalah CORS atau koneksi.'
    );
  }

  const teks = await res.text();

  console.log('HTTP status:', res.status);
  console.log('Respons Apps Script:', teks);

  let hasil;

  try {
    hasil = JSON.parse(teks);
  } catch (error) {
    throw new Error(
      'Respons server bukan JSON. Periksa deployment Apps Script. ' +
      teks.slice(0, 200)
    );
  }

  if (!res.ok) {
    throw new Error(
      hasil.error || 'HTTP ' + res.status
    );
  }

  return hasil;
}


  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const files = [...input.files];
    if (!files.length) return;

    const kategori = kategoriDipilih();
    const mode = modeSekarang();
    const nama = ambilNama();

    btn.disabled = true;
    let berhasil = 0;

    try {
      for (let i = 0; i < files.length; i++) {
        setStatus('Mengirim ' + (i + 1) + ' dari ' + files.length + '...');
        const hasil = await kirim(files[i], kategori, nama);
        if (!hasil.success) throw new Error(hasil.error || 'Tidak diketahui');
        berhasil++;
      }

      setStatus(
        mode === 'ganti'
          ? 'Gambar "' + nama + '" berhasil diganti.'
          : berhasil + ' gambar berhasil ditambahkan.',
        'ok'
      );
      form.reset();
      isiNama();
      muatData();
    } catch (err) {
      const info = files.length > 1 ? ' (' + berhasil + ' dari ' + files.length + ' sudah terkirim)' : '';
      setStatus('Gagal: ' + err.message + info, 'err');
      if (berhasil) muatData();
    } finally {
      btn.disabled = false;
    }
  });

  isiNama();
  muatData();
</script>
</body>
</html>
